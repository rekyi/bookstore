<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookstore</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/bookstore_logo.webp" />
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/assets.css" />
    <link rel="stylesheet" href="styles.css" />

    <script src="assets/js/data.js" defer></script>
    <script src="assets/js/template.js"></script>
    <script src="assets/js/script.js" defer></script>
  </head>
  <body>
    <header>
      <div class="header-content">
        <div class="logo-group">
          <img src="assets/images/bookstore_logo.webp" alt="" width="289" height="263" aria-hidden="true" />
          <span>Bookstore</span>
        </div>
      </div>
    </header>

    <main>
      <section class="photo-album">
        <h1>
          I Have A Problem With Cat Memes<br />
          <span class="h1-title">(but it's a bookstore)</span>
        </h1>
        <div class="photo-grid" id="photo-grid"></div>
        <dialog class="dialog" id="image-dialog" aria-labelledby="dialog-caption">
          <div class="dialog-content">
            <header class="dialog-header">
              <form method="dialog">
                <button class="dialog-close" aria-label="Close dialog">
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path
                      d="M6.575 7.975L1.675 12.875C1.49167 13.0583 1.25833 13.15 0.975 13.15C0.691667 13.15 0.458333 13.0583 0.275 12.875C0.0916667 12.6917 0 12.4583 0 12.175C0 11.8917 0.0916667 11.6583 0.275 11.475L5.175 6.575L0.275 1.675C0.0916667 1.49167 0 1.25833 0 0.975C0 0.691667 0.0916667 0.458333 0.275 0.275C0.458333 0.0916667 0.691667 0 0.975 0C1.25833 0 1.49167 0.0916667 1.675 0.275L6.575 5.175L11.475 0.275C11.6583 0.0916667 11.8917 0 12.175 0C12.4583 0 12.6917 0.0916667 12.875 0.275C13.0583 0.458333 13.15 0.691667 13.15 0.975C13.15 1.25833 13.0583 1.49167 12.875 1.675L7.975 6.575L12.875 11.475C13.0583 11.6583 13.15 11.8917 13.15 12.175C13.15 12.4583 13.0583 12.6917 12.875 12.875C12.6917 13.0583 12.4583 13.15 12.175 13.15C11.8917 13.15 11.6583 13.0583 11.475 12.875L6.575 7.975Z"
                      fill="currentColor"
                    />
                  </svg>
                </button>
              </form>
            </header>
            <figure>
              <figcaption>
                <h2 class="dialog-title" id="dialog-caption">Dialog heading</h2>
              </figcaption>

              <img class="dialog-img" id="dialog-rendered" alt="" />

              <div class="dialog-nav">
                <button class="dialog-back" id="dialog-back" aria-label="Previous image">
                  <svg width="22" height="19" viewBox="0 0 22 19" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path
                      d="M12.8028 0.292893C12.4123 -0.0976311 11.7791 -0.0976311 11.3886 0.292893C10.9981 0.683417 10.9981 1.31658 11.3886 1.70711L18.1673 8.48584H1C0.447715 8.48584 0 8.93355 0 9.48584C0 10.0381 0.447715 10.4858 1 10.4858H18.1662L11.3886 17.2635C10.9981 17.654 10.9981 18.2871 11.3886 18.6777C11.7791 19.0682 12.4123 19.0682 12.8028 18.6777L21.2614 10.2191C21.4582 10.0364 21.5814 9.77553 21.5814 9.48584C21.5814 9.29694 21.529 9.12027 21.438 8.96957C21.3969 8.90137 21.3469 8.83702 21.2881 8.77817L12.8028 0.292893Z"
                      fill="currentColor"
                    />
                  </svg>
                </button>

                <span class="dialog-counter" id="dialog-counter"></span>

                <button class="dialog-next" id="dialog-next" aria-label="Next image">
                  <svg width="22" height="19" viewBox="0 0 22 19" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path
                      d="M12.8028 0.292893C12.4123 -0.0976311 11.7791 -0.0976311 11.3886 0.292893C10.9981 0.683417 10.9981 1.31658 11.3886 1.70711L18.1673 8.48584H1C0.447715 8.48584 0 8.93355 0 9.48584C0 10.0381 0.447715 10.4858 1 10.4858H18.1662L11.3886 17.2635C10.9981 17.654 10.9981 18.2871 11.3886 18.6777C11.7791 19.0682 12.4123 19.0682 12.8028 18.6777L21.2614 10.2191C21.4582 10.0364 21.5814 9.77553 21.5814 9.48584C21.5814 9.29694 21.529 9.12027 21.438 8.96957C21.3969 8.90137 21.3469 8.83702 21.2881 8.77817L12.8028 0.292893Z"
                      fill="currentColor"
                    />
                  </svg>
                </button>
              </div>
            </figure>

            <div class="dialog-action-bar">
              <span class="dialog-price" id="dialog-price"></span>
              <div class="dialog-likes">
                <span class="like-count" id="like-count"></span>
                <button class="like-button" id="like-button" aria-label="Like">
                  <svg class="checkmark" viewBox="0 0 256 256">
                    <path
                      d="M224.6,51.9a59.5,59.5,0,0,0-43-19.9,60.5,60.5,0,0,0-44,17.6L128,59.1l-7.5-7.4C97.2,28.3,59.2,26.3,35.9,47.4a59.9,59.9,0,0,0-2.3,87l83.1,83.1a15.9,15.9,0,0,0,22.6,0l81-81C243.7,113.2,245.6,75.2,224.6,51.9Z"
                      stroke-width="12"
                      fill="none"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <div class="dialog-comments">
              <h3>Comments:</h3>
              <ul class="comments-list" id="comments-list">
                --Comments here--
              </ul>
              <form class="comment-form" id="comment-form">
                <input class="comment-input" id="comment-input" type="text" placeholder="Your Comment ..." required />
                <button class="comment-submit" type="submit" aria-label="Submit Comment">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M10.4995 13.5001L20.9995 3.00005M10.6271 13.8281L13.2552 20.5861C13.4867 21.1815 13.6025 21.4791 13.7693 21.566C13.9139 21.6414 14.0862 21.6415 14.2308 21.5663C14.3977 21.4796 14.5139 21.1821 14.7461 20.587L21.3364 3.69925C21.5461 3.16207 21.6509 2.89348 21.5935 2.72185C21.5437 2.5728 21.4268 2.45583 21.2777 2.40604C21.1061 2.34871 20.8375 2.45352 20.3003 2.66315L3.41258 9.25349C2.8175 9.48572 2.51997 9.60183 2.43326 9.76873C2.35809 9.91342 2.35819 10.0857 2.43353 10.2303C2.52043 10.3971 2.81811 10.5128 3.41345 10.7444L10.1715 13.3725C10.2923 13.4195 10.3527 13.443 10.4036 13.4793C10.4487 13.5114 10.4881 13.5509 10.5203 13.596C10.5566 13.6468 10.5801 13.7073 10.6271 13.8281Z"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </button>
              </form>
            </div>
          </div>
        </dialog>
      </section>
    </main>

    <footer>
      <div class="footer-headline">
        <div class="cat-animation">
          <img src="assets/images/cat_top.webp" alt="" width="298" height="150" aria-hidden="true" />
          <span>BOOKSTORE</span>
          <img src="assets/images/cat_bottom.webp" alt="" width="298" height="148" aria-hidden="true" />
        </div>
      </div>
      <p>&copy; 2026 I Still Have A Problem with <img class="cat-gif" src="assets/images/8772_popcat.gif" alt="" width="108" height="112" aria-hidden="true" /></p>
    </footer>
  </body>
</html>
